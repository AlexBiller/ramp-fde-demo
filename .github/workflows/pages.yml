name: Test and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate seed data and verify it is committed
        run: python3 seed/seed.py && git diff --exit-code data/
      - name: Test
        run: node --test tests/agent.test.mjs
      - name: Publish static site to the gh-pages branch
        run: |
          rm -rf _site && mkdir _site && cp -r index.html app data _site/ && touch _site/.nojekyll
          git fetch origin gh-pages || true
          git worktree add -B gh-pages ../pub origin/gh-pages 2>/dev/null || git worktree add --orphan -b gh-pages ../pub
          rsync -a --delete --exclude .git _site/ ../pub/
          cd ../pub
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" || (git commit -m "Publish ${GITHUB_SHA::7}" && git push origin gh-pages)
